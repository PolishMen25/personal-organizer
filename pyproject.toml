[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-organizer"
description = "Organiseur personnel de bureau, 100 % local : tâches, notes, minuteur de concentration et rangement de fichiers."
requires-python = ">=3.11"
keywords = ["organiseur", "taches", "notes", "minuteur", "hors-ligne", "pyside6"]
# La version unique vit dans organizer/__init__.py (0.1.0) ; voir [tool.setuptools.dynamic].
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = ["PySide6>=6.6"]

[project.scripts]
personal-organizer = "organizer.app:main"

# Variante sans fenêtre de console sur Windows ; nom distinct car les deux familles
# de scripts produisent le même fichier .exe et se recouvriraient à l'installation.
[project.gui-scripts]
personal-organizer-gui = "organizer.app:main"

[tool.setuptools]
packages = ["organizer", "organizer.ui"]

[tool.setuptools.dynamic]
version = { attr = "organizer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
