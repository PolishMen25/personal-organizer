name: Tests

on:
  push:
  pull_request:

# Lecture seule : les tests n'ont besoin que du code source.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows est la plateforme cible : un défaut qui ne s'y montre que là
        # doit bloquer la PR, pas être découvert à la construction de l'exécutable.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliothèques système requises par Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Suite de tests
        env:
          # Aucun serveur graphique sur l'exécuteur : Qt rend hors écran.
          QT_QPA_PLATFORM: offscreen
        # Pas de « -q » ici : pyproject.toml en fixe déjà un, et le second
        # masquerait la ligne de résumé des résultats dans le journal.
        run: python -m pytest
