name: Tests

on:
  push:
  pull_request:

# Lecture seule : les tests n'ont besoin que du code source.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliothèques système requises par Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Suite de tests
        env:
          # Aucun serveur graphique sur l'exécuteur : Qt rend hors écran.
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
